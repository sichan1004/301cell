  .modal .note{font-size:12px;color:var(--ink-2);margin:9px 2px 0;text-align:center;line-height:1.6}

  #stage{position:fixed;left:-20000px;top:0;width:1000px;background:#fff}
  .paper{width:1000px;background:#fff;color:#000;font-family:var(--f);padding:26px 30px 30px}
  .paper .plogo{height:38px;display:block}
  .paper .brand{display:flex;justify-content:space-between;font-size:12px;padding-bottom:7px;
                border-bottom:1.5px solid #000;margin-bottom:9px}
  .paper .titlebar{border:2px solid #000;padding:8px 12px;display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .paper .titlebar .dept{font-size:22px;font-weight:800}

  .paper .titlebar .main{font-size:24px;font-weight:800;letter-spacing:2px}
  .paper .titlebar .right{margin-left:auto;font-size:15px}

  .paper th,.paper td{border:1px solid #000;padding:4px 5px;font-size:12.5px;text-align:center;

  .paper .etc{border:1px solid #000;min-height:120px;padding:8px 10px;font-size:13px;white-space:pre-wrap;line-height:2}
  .paper .box{display:inline-block;width:11px;height:11px;border:1px solid #000;vertical-align:-1px;
              margin-right:3px;position:relative}
  .paper .box.on::after{content:"";position:absolute;left:2px;top:-2px;width:5px;height:9px;
              border:solid #000;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .paper .fin{border-bottom:1px solid #000;display:inline-block;min-width:74px;text-align:center;padding:0 4px}

<body>

<div class="app" id="app">
  <div class="brandbar"><span class="logo"></span><span class="dot"></span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="write" aria-selected="true">보고서 작성</button>
    <button class="tab" role="tab" data-t="inbox" aria-selected="false">지난 보고서</button>
  </div>

  <section id="v-write">
    <h2>이번 주 보고</h2>
    <div class="rule"></div>
    <p class="hint">채운 뒤 아래 <b>종이 서식 만들기</b>를 누르면 그대로 이미지가 됩니다.</p>
    <div class="grid g3">
      <div><label class="f">셀 이름</label><input type="text" id="r-cell" placeholder="○○"></div>
      <div><label class="f">셀장</label><input type="text" id="r-leader" placeholder="이름"></div>
      <div><label class="f">주일 날짜</label><input type="date" id="r-date"></div>
    </div>

    <h2>셀 출석</h2>
    <div class="sumbox" id="r-sum"></div>
    <div><label class="f">방문 (주일출석)</label><input type="number" id="r-visit" value="0" min="0" inputmode="numeric"></div>
    <p class="hint" style="margin-top:6px">나머지 숫자는 아래 셀원 입력에서 자동으로 계산됩니다.</p>

    <h2>셀원</h2>
    <p class="hint">이름을 적고, 항목마다 <b>○</b>(했음) 또는 <b>✕</b>(안 했음) 중 하나를 눌러 주세요.</p>
    <div class="todo" id="r-todo"></div>
    <div id="r-members"></div>
    <button class="addbtn" id="r-add">셀원 한 명 더 추가</button>

    <h2>새가족 섬김</h2>
    <div id="r-newcomers"></div>
    <button class="addbtn" id="r-addnew">새가족 추가</button>

    <h2>기타사항</h2>
    <p class="hint">금주의 사역 내용 및 셀 보고 사항</p>
    <textarea id="r-etc" placeholder="이번 주 셀 모임에서 나눈 내용, 기도 응답, 요청 사항 등"></textarea>
  </section>

  <section id="v-inbox" hidden>
    <h2>지난 보고서</h2>
    <div class="rule"></div>
    <p class="hint" id="i-where"></p>
    <input type="text" id="i-q" placeholder="셀 이름이나 셀장 이름으로 찾기">
    <p class="hint" id="i-count" style="margin:10px 0 0"></p>
    <div id="i-list" style="margin-top:8px"></div>
    <button class="addbtn" id="i-csv">전체 CSV로 내려받기</button>
    <button class="addbtn" id="i-backup">전체 백업 파일 내려받기</button>
    <button class="addbtn" id="i-restore">백업 파일 불러오기</button>
    <input type="file" id="i-file" accept=".json,application/json" multiple hidden>
    <p class="hint" style="margin-top:12px">보고서는 이 기기에 저장됩니다. 기기를 바꾸거나 초기화하기 전에 백업 파일을 내려받아 두세요.</p>
  </section>
</div>

<div class="bar" id="bar">
  <button class="btn" id="b-save">임시 저장</button>
  <button class="btn primary" id="b-make">종이 서식 만들기</button>
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <img id="shot" alt="종이 서식 미리보기">
    <div class="mact">
      <button id="m-close">닫기</button>
      <button id="m-dl">사진 저장</button>
      <button class="primary" id="m-share">카카오톡으로 보내기</button>
      <button class="primary" id="m-save">보관함에 저장</button>
    </div>
    <p class="note" id="m-note"></p>
  </div>
</div>
<div id="stage"><div class="paper" id="paper"></div></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)}, pad=function(n){return String(n).padStart(2,"0")};
var esc=function(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
var bx=function(on){return '<span class="box'+(on?" on":"")+'"></span>'};
var today=function(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},2600)}

/* ══ 저장소: 앱 저장소 → 기기 저장소 → 메모리 순으로 사용 ══ */
var DB=(function(){
  try{ if(window.storage&&typeof window.storage.set==="function"){
    return {kind:"app",
      get:function(k){return window.storage.get(k,false)},
      set:function(k,v){return window.storage.set(k,v,false)},
      del:function(k){return window.storage.delete(k,false)},
      list:function(p){return window.storage.list(p,false)}};
  }}catch(e){}
  var P="cellreport:", ls=null, mem=null;
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t");ls=localStorage;}catch(e){mem={}}
  function g(k){return mem?(k in mem?mem[k]:null):ls.getItem(P+k)}
  function s(k,v){if(mem)mem[k]=v;else ls.setItem(P+k,v)}
  function d(k){if(mem)delete mem[k];else ls.removeItem(P+k)}
  function keys(){if(mem)return Object.keys(mem);
    var out=[];for(var i=0;i<ls.length;i++){var k=ls.key(i);
      if(k.indexOf(P)===0)out.push(k.slice(P.length))}return out}
  return {kind:mem?"memory":"device",
    get:function(k){return new Promise(function(res,rej){var v=g(k);
      v===null?rej(new Error("없음")):res({key:k,value:v})})},
    set:function(k,v){return new Promise(function(res,rej){
      try{s(k,v);res({key:k,value:v})}catch(e){rej(e)}})},
    del:function(k){return new Promise(function(res){d(k);res({key:k,deleted:true})})},
    list:function(p){return new Promise(function(res){res({keys:keys().filter(function(k){
      return k.indexOf(p||"")===0})})})}
  };
})();

/* ══ 상태 ══ */
var TYPES=["기존","장결","새가족"];
var TRI=["worship","cellmt","bible","apply"];

function st(v){return v===true?"yes":(v===false?"no":"none")}
function mk(v){return v===true?" ○":(v===false?" ✕":"")}
function needs(m){ for(var i=0;i<TRI.length;i++) if(m[TRI[i]]==null) return true; return false; }

function ynRow(k,m){
  var v=m[k], undone=(v==null);
  return '<div class="ynrow'+(undone?" none":"")+'">'+
      '<span class="ynlab">'+TRILABEL[k]+'</span>'+
      (undone?'<span class="ynask">선택</span>':'')+
      '<button class="yn o" data-k="'+k+'" data-v="1" aria-pressed="'+(v===true)+'">○</button>'+
      '<button class="yn x" data-k="'+k+'" data-v="0" aria-pressed="'+(v===false)+'">✕</button>'+
    '</div>';
}
function memberHTML(m,i){
  var bad=!!(m.name.trim()&&needs(m));
  return '<div class="mcard'+(bad?" needs":"")+'" data-i="'+i+'">'+
      '<div class="mrow"><span class="mno">'+(i+1)+'</span>'+
        '<input type="text" data-k="name" value="'+esc(m.name)+'" placeholder="이름">'+
        '<span class="miss"'+(bad?"":" hidden")+'>미입력</span></div>'+
      '<div class="seg">'+TYPES.map(function(t){
        return '<button data-type="'+t+'" aria-pressed="'+(m.type===t)+'">'+t+'</button>'}).join("")+'</div>'+
      '<div class="ynbox">'+TRI.map(function(k){return ynRow(k,m)}).join("")+'</div>'+
      '<div class="notefield">'+
        '<span class="notelab">✎ <b>기도제목 · 결석사유</b> — 여기에 적어 주세요</span>'+
        '<textarea class="noteinput" data-k="note" rows="2" placeholder="예) 어머니 건강을 위해 기도합니다 / 출장으로 결석">'+esc(m.note)+'</textarea>'+
      '</div>'+
      '<div class="chips">'+
        '<button class="chip alt" data-k="tel" aria-pressed="'+m.tel+'">주중 전화'+(m.tel?" ✓":"")+'</button>'+
        '<button class="chip alt" data-k="visit" aria-pressed="'+m.visit+'">주중 심방'+(m.visit?" ✓":"")+'</button></div>'+
    '</div>';
}

$("#r-members").addEventListener("input",function(e){
  var c=e.target.closest(".mcard"); if(!c)return;
  var m=R.members[+c.dataset.i];
  m[e.target.dataset.k]=e.target.value;
  markCard(c,m); updateSummary();});
$("#r-members").addEventListener("click",function(e){
  var c=e.target.closest(".mcard"); if(!c)return;
  var b=e.target.closest("button"); if(!b)return;
  var i=+c.dataset.i, m=R.members[i];
  if(b.dataset.type){ m.type=b.dataset.type; }
  else if(b.classList.contains("yn")){
    var k=b.dataset.k, want=(b.dataset.v==="1");
    m[k] = (m[k]===want) ? null : want;
  }
  else if(b.classList.contains("chip")){ var k2=b.dataset.k; m[k2]=!m[k2]; }
  else return;
  c.outerHTML=memberHTML(m,i);
  updateSummary();
});
function markCard(c,m){
  var bad=!!(m.name.trim()&&needs(m));
  c.classList.toggle("needs",bad);
  var b=c.querySelector(".miss"); if(b) b.hidden=!bad;
}

  if(R.members.length>=16)return toast("종이 서식은 16명까지입니다");
  R.members.push(blankMember());renderMembers();};

function counts(){
  var named=R.members.filter(function(m){return m.name.trim()}),c={};
  TYPES.forEach(function(t){c[t]={
    roll:named.filter(function(m){return m.type===t}).length,
    att:named.filter(function(m){return m.type===t&&m.worship===true}).length}});
  return c;}
function updateSummary(){
  var c=counts(), v=+($("#r-visit").value||0);
  var rt=TYPES.reduce(function(a,t){return a+c[t].roll},0);
  var at=TYPES.reduce(function(a,t){return a+c[t].att},0)+v;
  $("#r-sum").innerHTML=
    '<div class="sumline"><span>재적 (기존·장결·새가족)</span><b>'+c["기존"].roll+" · "+c["장결"].roll+" · "+c["새가족"].roll+" = "+rt+'</b></div>'+
    '<div class="sumline"><span>주일출석 (기존·장결·새가족·방문)</span><b>'+c["기존"].att+" · "+c["장결"].att+" · "+c["새가족"].att+" · "+v+" = "+at+'</b></div>';
  var named=R.members.filter(function(m){return m.name.trim()});
  var left=named.filter(needs).length, box=$("#r-todo");
  if(!named.length){ box.className="todo"; box.textContent="셀원 이름을 먼저 적어 주세요."; }
  else if(left){ box.className="todo"; box.textContent="아직 선택하지 않은 셀원 "+left+"명 · 점선으로 표시된 항목을 눌러 주세요"; }
  else { box.className="todo done"; box.textContent="셀원 "+named.length+"명 모두 선택 완료"; }
}

var shotCanvas=null, shotName="", shotURL="", shareURL="";
function fileName(){return "셀보고서_"+(R.cell||"셀")+"_"+(R.date||today())+".png"}
$("#b-make").onclick=function(){
  var b=$("#b-make"); b.disabled=true; b.textContent="만드는 중…";
  $("#paper").innerHTML=paper();
  setTimeout(function(){
    html2canvas($("#paper"),{scale:2,backgroundColor:"#ffffff"}).then(function(cv){
      shotCanvas=cv; shotName=fileName();
      shotURL=cv.toDataURL("image/png");
      shareURL=cv.toDataURL("image/jpeg",0.92);
      $("#shot").src=shareURL;
      $("#m-save").style.display=""; $("#m-share").style.display="";
      $("#m-dl").onclick=function(){saveImage(shotURL,shotName)};
      $("#m-share").onclick=function(){shareDataURL(shareURL,jpgName(shotName))};
      openModal();
      b.disabled=false; b.textContent="종이 서식 만들기";
    }).catch(function(){toast("이미지를 만들지 못했습니다. 다시 시도해 주세요");
      b.disabled=false; b.textContent="종이 서식 만들기";});
  },80);
};
function saveImage(url,name){
  try{var a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();toast("사진을 저장했습니다");}
  catch(e){toast("이미지를 길게 눌러 저장해 주세요");}
}
function jpgName(n){return String(n).replace(/\.png$/i,".jpg")}
function dataKB(u){return Math.round(String(u).length*0.75/1024)}
function shareReason(){
  if(!window.isSecureContext) return "안전하지 않은 연결이라 공유가 막혔습니다 (https로 열어 주세요)";
  if(!navigator.share) return "이 브라우저는 공유 기능을 지원하지 않습니다 (크롬·사파리로 열어 주세요)";
  if(!navigator.canShare) return "이 브라우저는 사진 공유를 지원하지 않습니다";
  try{
    if(!navigator.canShare({files:[new File([new Uint8Array([1])],"t.png",{type:"image/png"})]}))
      return "이 브라우저는 사진 공유를 지원하지 않습니다 (카톡 내장 브라우저면 크롬으로 열어 주세요)";
  }catch(e){ return "이 브라우저는 사진 공유를 지원하지 않습니다"; }
  return "";
}
function openModal(){
  var r=shareReason();
  var n=document.getElementById("m-note");
  if(n) n.textContent = r ? r
    : ("보내기를 누르면 공유창이 뜹니다. 거기서 카카오톡을 선택하세요." +
       (shareURL ? "  (사진 약 "+dataKB(shareURL)+"KB)" : ""));
  var sb=document.getElementById("m-share");
  if(sb) sb.style.opacity = r ? ".55" : "1";
  document.getElementById("modal").classList.add("on");
}
function dataURLtoFile(u,name){
  var parts=String(u).split(","), m=(parts[0].match(/:(.*?);/)||[])[1]||"image/png";
  var bin=atob(parts[1]), n=bin.length, arr=new Uint8Array(n);
  while(n--) arr[n]=bin.charCodeAt(n);
  return new File([arr],name,{type:m});
}
function shareDataURL(url,name){
  if(!url) return toast("먼저 서식을 만들어 주세요");
  var f=null;
  try{ f=dataURLtoFile(url,name); }
  catch(e){ saveImage(url,name); return toast("사진 변환에 실패해 저장만 했습니다"); }
  var can=false;
  try{ can = !!(navigator.canShare && navigator.canShare({files:[f]})); }catch(e){}
  if(navigator.share && can){
    navigator.share({files:[f],title:name}).then(function(){
      toast("보냈습니다");
    }).catch(function(err){
      var nm=(err&&err.name)||"";
      if(nm==="AbortError") return;
      if(nm==="NotAllowedError"){ toast("버튼을 한 번 더 눌러 주세요"); return; }
      saveImage(url,name);
      toast("공유가 막혀 사진으로 저장했습니다 ("+nm+")");
    });
    return;
  }
  saveImage(url,name);
  toast(shareReason()||"바로 보내기를 지원하지 않아 사진으로 저장했습니다");
}

function boot(){
  DB.get("draft").then(function(r){
    var d=JSON.parse(r.value);
    for(var k in d) R[k]=d[k];
    if(R.tri!==1){
      (R.members||[]).forEach(function(m){
        TRI.forEach(function(k){ if(m[k]===false) m[k]=null; });
      });
      R.tri=1;
    }
    $("#r-cell").value=R.cell; $("#r-leader").value=R.leader;
    $("#r-date").value=R.date; $("#r-etc").value=R.etc; $("#r-visit").value=R.visit||0;
  }).catch(function(){}).then(function(){
    if(!R.date){R.date=today();}
    $("#r-date").value=R.date;
    renderMembers(); renderNew();
  });
  $("#i-where").textContent = DB.kind==="device"
    ? "이 기기에 저장된 보고서입니다. 기기를 바꾸기 전에 백업을 내려받아 두세요."
    : "저장된 보고서 목록입니다.";
}

/* ══ 보관함 ══ */
var inbox=[];
function loadInbox(){
  $("#i-list").innerHTML='<div class="empty">불러오는 중…</div>'; inbox=[];
  DB.list("report:").then(function(res){
    var keys=(res&&res.keys)||[];
    return Promise.all(keys.map(function(k){
      return DB.get(k).then(function(v){
        try{var o=JSON.parse(v.value);o.key=k;inbox.push(o)}catch(e){}
      }).catch(function(){});
    }));
  }).catch(function(){}).then(function(){
    inbox.sort(function(a,b){return String(b.at||"").localeCompare(String(a.at||""))});
    drawInbox();
  });
}
function drawInbox(){
  var q=($("#i-q").value||"").trim().toLowerCase();
  var list=inbox.filter(function(it){return !q||((it.cell||"")+(it.leader||"")).toLowerCase().indexOf(q)>=0});
  $("#i-count").textContent="전체 "+inbox.length+"건"+(q?" · 검색 "+list.length+"건":"");
  var box=$("#i-list");
  if(!list.length){box.innerHTML='<div class="empty">'+
    (q?"찾는 보고서가 없습니다.":"아직 저장된 보고서가 없습니다.<br>작성 후 “보관함에 저장”을 눌러 보세요.")+"</div>";return;}
  box.innerHTML=list.map(function(it){var i=inbox.indexOf(it);
    return '<div class="item"><h4>'+esc(it.title)+'</h4>'+
      '<p>'+esc(it.sub)+' · 저장 '+esc(String(it.at||"").slice(0,16).replace("T"," "))+'</p>'+
      '<div class="acts"><button data-a="img" data-i="'+i+'">사진 보기</button>'+
      '<button data-a="json" data-i="'+i+'">파일 저장</button>'+
      '<button data-a="del" data-i="'+i+'">삭제</button></div></div>'}).join("");
}
$("#i-q").oninput=drawInbox;
$("#i-list").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]"); if(!b)return;
  var it=inbox[+b.dataset.i], a=b.dataset.a;
  if(a==="img"){
    if(!it.png)return toast("저장된 사진이 없습니다");
    var nm=it.title+"_"+(it.date||"")+".jpg";
    $("#shot").src=it.png; shotCanvas=null; shareURL=it.png;
    $("#m-save").style.display="none"; $("#m-share").style.display="";
    $("#m-dl").onclick=function(){saveImage(it.png,nm)};
    $("#m-share").onclick=function(){shareDataURL(it.png,nm)};
    openModal();
  }
  if(a==="json")download(JSON.stringify(it,null,2),it.title+"_"+(it.date||"")+".json","application/json");
  if(a==="del"){
    if(!confirm("이 보고서를 삭제할까요? 되돌릴 수 없습니다."))return;
    DB.del(it.key).then(function(){toast("삭제했습니다");loadInbox()})
      .catch(function(){toast("삭제하지 못했습니다")});}
});
function download(text,name,mime){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+text],{type:mime+";charset=utf-8"}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);}

$("#i-csv").onclick=function(){
  if(!inbox.length)return toast("내려받을 보고서가 없습니다");
  var rows=[["셀","셀장","날짜","구분","이름","예배","셀모임","성경읽기","적용점검","주중전화","주중심방","기도제목/결석사유"]];
  inbox.forEach(function(it){(it.data.members||[]).forEach(function(m){
    if(!m.name)return;
    var cm=function(v){return v===true?"O":(v===false?"X":"")};
    rows.push([it.cell,it.leader,it.date,m.type,m.name,cm(m.worship),cm(m.cellmt),
      cm(m.bible),cm(m.apply),m.tel?"O":"",m.visit?"O":"",String(m.note||"").replace(/"/g,'""')]);});});
  download(rows.map(function(r){return r.map(function(v){return '"'+(v==null?"":v)+'"'}).join(",")}).join("\n"),
    "셀보고서_모음_"+today()+".csv","text/csv");
  toast("CSV를 내려받았습니다");};

$("#i-backup").onclick=function(){
  if(!inbox.length)return toast("백업할 보고서가 없습니다");
  download(JSON.stringify({kind:"cellreport",backupAt:new Date().toISOString(),count:inbox.length,items:inbox},null,2),
    "셀보고서_전체백업_"+today()+".json","application/json");
  toast("백업 파일을 내려받았습니다");};

$("#i-restore").onclick=function(){$("#i-file").click()};
$("#i-file").onchange=function(e){
  var files=Array.prototype.slice.call(e.target.files||[]); if(!files.length)return;
  var all=[], bad=0;
  Promise.all(files.map(function(f){
    return new Promise(function(res){
      var fr=new FileReader();
      fr.onload=function(){
        try{ var o=JSON.parse(fr.result);
          all=all.concat(o.items||(Array.isArray(o)?o:[o])); }
        catch(err){ bad++; }
        res();
      };
      fr.onerror=function(){bad++;res()};
      fr.readAsText(f,"utf-8");
    });
  })).then(function(){
    if(!all.length){toast("불러올 보고서가 없습니다");e.target.value="";return;}
    var seen={}; inbox.forEach(function(it){ seen[(it.cell||"")+"|"+(it.date||"")]=true });
    var fresh=all.filter(function(it){
      var k=(it.cell||"")+"|"+(it.date||"");
      if(seen[k])return false; seen[k]=true; return true;
    });
    return Promise.all(fresh.map(function(it){
      var id="report:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      return DB.set(id,JSON.stringify(it));
    })).then(function(){
      toast(fresh.length+"건 추가"+(all.length-fresh.length?" · 중복 "+(all.length-fresh.length)+"건 건너뜀":"")
        +(bad?" · 오류 "+bad+"개":""));
      loadInbox();
    });
  }).catch(function(){toast("불러오지 못했습니다")})
  .then(function(){e.target.value=""});
};

boot();
})();
</script>

</html>
