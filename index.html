<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="셀 보고서">
<meta name="theme-color" content="#2E4E7E">
<title>장년부 셀 보고서</title>
<style>
  :root{
    --paper:#FBFBF9; --ink:#1A1E24; --ink-2:#5A626E; --line:#D6D8D3;
    --accent:#2E4E7E; --accent-soft:#E8EEF7; --ok:#2F6B4F; --warn:#8A4B2A; --radius:10px;
    --f:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);font-family:var(--f)}
  .app{color:var(--ink);max-width:560px;margin:0 auto;padding:0 14px 96px;font-size:15px;line-height:1.5}

  /* ── 잠금 화면 ── */
  .gate{max-width:400px;margin:0 auto;padding:64px 20px;text-align:center;font-family:var(--f);color:var(--ink)}
  .gate h1{font-size:22px;margin:0 0 6px;letter-spacing:-.4px}
  .gate p{font-size:13.5px;color:var(--ink-2);margin:0 0 26px;line-height:1.7}
  .gate input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;
              font:inherit;font-size:16px;text-align:center;background:#fff}

  .tabs{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;gap:4px;
        padding:10px 0 8px;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:10px 4px;border:1px solid var(--line);background:#fff;border-radius:var(--radius);
       font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  h2{font-size:17px;margin:20px 0 6px;letter-spacing:-.2px}
  .hint{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.65}
  .grid{display:grid;gap:8px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr}
  label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px}
  input[type=text],input[type=number],input[type=date],input[type=password],textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:64px}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .mcard{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:11px 12px;margin-bottom:9px}
  .mrow{display:flex;align-items:center;gap:8px}
  .mno{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--accent-soft);
       color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center}
  .seg{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;padding:8px 0;border:0;border-right:1px solid var(--line);background:#fff;
              font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;
        font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
  .chip.alt[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
  .addbtn{width:100%;padding:11px;border:1px dashed var(--line);background:transparent;
          border-radius:var(--radius);font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;margin-top:6px}
  .sumbox{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:11px 12px;margin-bottom:12px}
  .sumline{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
  .sumline b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,251,249,.96);
       border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
       display:flex;gap:8px;max-width:560px;margin:0 auto}
  .btn{flex:1;padding:14px 8px;border-radius:var(--radius);border:1px solid var(--accent);
       background:#fff;color:var(--accent);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:120;background:var(--ink);
         color:#fff;padding:11px 17px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;
         transition:opacity .2s;max-width:88%;text-align:center;line-height:1.5}
  .toast.on{opacity:1}
  .item{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:11px 12px;margin-bottom:8px}
  .item h4{margin:0 0 3px;font-size:14.5px} .item p{margin:0;font-size:12.5px;color:var(--ink-2)}
  .item .acts{display:flex;gap:6px;margin-top:9px}
  .item .acts button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:8px;
                     font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
  .empty{text-align:center;color:var(--ink-2);font-size:13.5px;padding:36px 10px;line-height:1.7;
         border:1px dashed var(--line);border-radius:var(--radius)}
  .modal{position:fixed;inset:0;z-index:100;background:rgba(26,30,36,.75);display:none;overflow:auto;padding:14px}
  .modal.on{display:block}
  .modal .sheet{max-width:920px;margin:0 auto;background:#fff;border-radius:var(--radius);padding:12px}
  .modal img{width:100%;display:block;border:1px solid var(--line)}
  .modal .mact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .modal .mact button{flex:1;min-width:92px;padding:13px 6px;border-radius:8px;border:1px solid var(--accent);
                      background:#fff;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .modal .mact button.primary{background:var(--accent);color:#fff}
  .modal .note{font-size:12px;color:var(--ink-2);margin:9px 2px 0;text-align:center;line-height:1.6}

  #stage{position:fixed;left:-20000px;top:0;width:1000px;background:#fff}
  .paper{width:1000px;background:#fff;color:#000;font-family:var(--f);padding:26px 30px 30px}
  .paper .brand{display:flex;justify-content:space-between;font-size:12px;padding-bottom:5px;
                border-bottom:1.5px solid #000;margin-bottom:9px}
  .paper .titlebar{border:2px solid #000;padding:8px 12px;display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .paper .titlebar .dept{font-size:22px;font-weight:800}
  .paper .titlebar .u{border-bottom:1px solid #000;min-width:110px;display:inline-block;text-align:center;font-size:17px;font-weight:600}
  .paper .titlebar .main{font-size:24px;font-weight:800;letter-spacing:2px}
  .paper .titlebar .right{margin-left:auto;font-size:15px}
  .paper .sec{font-size:16px;font-weight:800;margin:12px 0 5px}
  .paper table{width:100%;border-collapse:collapse;table-layout:fixed}
  .paper th,.paper td{border:1px solid #000;padding:4px 5px;font-size:12.5px;text-align:center;
                      vertical-align:middle;height:26px;overflow-wrap:anywhere}
  .paper th{background:#E4E4E4;font-weight:700}
  .paper td.l{text-align:left}
  .paper td.nw{white-space:nowrap;font-size:11.5px;letter-spacing:-.3px}
  .paper .etc{border:1px solid #000;min-height:120px;padding:8px 10px;font-size:13px;white-space:pre-wrap;line-height:2}
  .paper .box{display:inline-block;width:11px;height:11px;border:1px solid #000;vertical-align:-1px;
              margin-right:3px;position:relative}
  .paper .box.on::after{content:"";position:absolute;left:2px;top:-2px;width:5px;height:9px;
              border:solid #000;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .paper .fin{border-bottom:1px solid #000;display:inline-block;min-width:74px;text-align:center;padding:0 4px}
</style>
</head>
<body>

<!-- ══ 리더 잠금 ══ -->
<div class="gate" id="gate">
  <h1>장년부 셀 보고서</h1>
  <p>셀 리더 전용입니다.<br>암호를 입력해 주세요.</p>
  <input type="password" id="g-pw" placeholder="암호" autocomplete="off" inputmode="text">
  <button class="btn primary" id="g-in" style="width:100%;margin-top:12px">열기</button>
</div>

<div class="app" id="app" hidden>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="write" aria-selected="true">보고서 작성</button>
    <button class="tab" role="tab" data-t="inbox" aria-selected="false">지난 보고서</button>
  </div>

  <section id="v-write">
    <h2>이번 주 보고</h2>
    <p class="hint">채운 뒤 아래 <b>종이 서식 만들기</b>를 누르면 그대로 이미지가 됩니다.</p>
    <div class="grid g3">
      <div><label class="f">셀 이름</label><input type="text" id="r-cell" placeholder="○○"></div>
      <div><label class="f">셀장</label><input type="text" id="r-leader" placeholder="이름"></div>
      <div><label class="f">주일 날짜</label><input type="date" id="r-date"></div>
    </div>

    <h2>셀 출석</h2>
    <div class="sumbox" id="r-sum"></div>
    <div><label class="f">방문 (주일출석)</label><input type="number" id="r-visit" value="0" min="0" inputmode="numeric"></div>
    <p class="hint" style="margin-top:6px">나머지 숫자는 아래 셀원 입력에서 자동으로 계산됩니다.</p>

    <h2>셀원</h2>
    <p class="hint">이름을 적고 해당하는 항목만 눌러 주세요.</p>
    <div id="r-members"></div>
    <button class="addbtn" id="r-add">셀원 한 명 더 추가</button>

    <h2>새가족 섬김</h2>
    <div id="r-newcomers"></div>
    <button class="addbtn" id="r-addnew">새가족 추가</button>

    <h2>기타사항</h2>
    <p class="hint">금주의 사역 내용 및 셀 보고 사항</p>
    <textarea id="r-etc" placeholder="이번 주 셀 모임에서 나눈 내용, 기도 응답, 요청 사항 등"></textarea>
  </section>

  <section id="v-inbox" hidden>
    <h2>지난 보고서</h2>
    <p class="hint" id="i-where"></p>
    <input type="text" id="i-q" placeholder="셀 이름이나 셀장 이름으로 찾기">
    <p class="hint" id="i-count" style="margin:10px 0 0"></p>
    <div id="i-list" style="margin-top:8px"></div>
    <button class="addbtn" id="i-csv">전체 CSV로 내려받기</button>
    <button class="addbtn" id="i-backup">전체 백업 파일 내려받기</button>
    <button class="addbtn" id="i-restore">백업 파일 불러오기</button>
    <input type="file" id="i-file" accept=".json,application/json" hidden>
    <p class="hint" style="margin-top:12px">보고서는 이 기기에 저장됩니다. 기기를 바꾸거나 초기화하기 전에 백업 파일을 내려받아 두세요.</p>
  </section>
</div>

<div class="bar" id="bar" hidden>
  <button class="btn" id="b-save">임시 저장</button>
  <button class="btn primary" id="b-make">종이 서식 만들기</button>
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <img id="shot" alt="종이 서식 미리보기">
    <div class="mact">
      <button id="m-close">닫기</button>
      <button id="m-dl">사진 저장</button>
      <button class="primary" id="m-share">카톡으로 보내기</button>
      <button class="primary" id="m-save">보관함에 저장</button>
    </div>
    <p class="note" id="m-note">저장이 안 되면 이미지를 길게 눌러 “사진에 저장”을 선택하세요.</p>
  </div>
</div>
<div id="stage"><div class="paper" id="paper"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
"use strict";
/* ▼▼▼ 리더 암호는 이 줄만 바꾸세요 ▼▼▼ */
var LEADER_PW = "cell2026";
/* ▲▲▲ ───────────────────────── ▲▲▲ */

var $=function(s){return document.querySelector(s)}, pad=function(n){return String(n).padStart(2,"0")};
var esc=function(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
var bx=function(on){return '<span class="box'+(on?" on":"")+'"></span>'};
var today=function(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},2600)}

/* ══ 저장소: 앱 저장소 → 기기 저장소 → 메모리 순으로 사용 ══ */
var DB=(function(){
  try{ if(window.storage&&typeof window.storage.set==="function"){
    return {kind:"app",
      get:function(k){return window.storage.get(k,false)},
      set:function(k,v){return window.storage.set(k,v,false)},
      del:function(k){return window.storage.delete(k,false)},
      list:function(p){return window.storage.list(p,false)}};
  }}catch(e){}
  var P="cellreport:", ls=null, mem=null;
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t");ls=localStorage;}catch(e){mem={}}
  function g(k){return mem?(k in mem?mem[k]:null):ls.getItem(P+k)}
  function s(k,v){if(mem)mem[k]=v;else ls.setItem(P+k,v)}
  function d(k){if(mem)delete mem[k];else ls.removeItem(P+k)}
  function keys(){if(mem)return Object.keys(mem);
    var out=[];for(var i=0;i<ls.length;i++){var k=ls.key(i);
      if(k.indexOf(P)===0)out.push(k.slice(P.length))}return out}
  return {kind:mem?"memory":"device",
    get:function(k){return new Promise(function(res,rej){var v=g(k);
      v===null?rej(new Error("없음")):res({key:k,value:v})})},
    set:function(k,v){return new Promise(function(res,rej){
      try{s(k,v);res({key:k,value:v})}catch(e){rej(e)}})},
    del:function(k){return new Promise(function(res){d(k);res({key:k,deleted:true})})},
    list:function(p){return new Promise(function(res){res({keys:keys().filter(function(k){
      return k.indexOf(p||"")===0})})})}
  };
})();

/* ══ 잠금 ══ */
function unlock(){
  $("#gate").hidden=true; $("#app").hidden=false; $("#bar").hidden=false;
  try{sessionStorage.setItem("cellreport:ok","1")}catch(e){}
  boot();
}
$("#g-in").onclick=function(){
  if($("#g-pw").value===LEADER_PW) unlock();
  else { toast("암호가 맞지 않습니다"); $("#g-pw").value=""; }
};
$("#g-pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("#g-in").click()});
try{ if(sessionStorage.getItem("cellreport:ok")==="1") unlock(); }catch(e){}

/* ══ 상태 ══ */
var TYPES=["기존","장결","새가족"];
function blankMember(){return {name:"",type:"기존",worship:false,cellmt:false,bible:false,apply:false,note:"",tel:false,visit:false}}
function blankNew(){return {name:"",reg:"",guide:"",tel:false,visit:false,etc:""}}
var R={cell:"",leader:"",date:"",visit:0,members:[],newcomers:[blankNew()],etc:""};
for(var i=0;i<6;i++)R.members.push(blankMember());
var tab="write";

document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){
  tab=b.dataset.t;
  document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x===b)});
  $("#v-write").hidden=tab!=="write"; $("#v-inbox").hidden=tab!=="inbox";
  $("#bar").style.display=tab==="inbox"?"none":"flex";
  if(tab==="inbox")loadInbox();
  window.scrollTo(0,0);
}});

/* ══ 셀원 ══ */
function renderMembers(){
  $("#r-members").innerHTML=R.members.map(function(m,i){return ''+
    '<div class="mcard" data-i="'+i+'">'+
      '<div class="mrow"><span class="mno">'+(i+1)+'</span>'+
        '<input type="text" data-k="name" value="'+esc(m.name)+'" placeholder="이름"></div>'+
      '<div class="seg">'+TYPES.map(function(t){
        return '<button data-type="'+t+'" aria-pressed="'+(m.type===t)+'">'+t+'</button>'}).join("")+'</div>'+
      '<div class="chips">'+
        '<button class="chip" data-k="worship" aria-pressed="'+m.worship+'">예배</button>'+
        '<button class="chip" data-k="cellmt" aria-pressed="'+m.cellmt+'">셀모임</button>'+
        '<button class="chip" data-k="bible" aria-pressed="'+m.bible+'">성경읽기</button>'+
        '<button class="chip" data-k="apply" aria-pressed="'+m.apply+'">적용점검</button></div>'+
      '<input type="text" data-k="note" style="margin-top:8px" value="'+esc(m.note)+'" placeholder="기도제목 · 결석사유">'+
      '<div class="chips">'+
        '<button class="chip alt" data-k="tel" aria-pressed="'+m.tel+'">주중 전화</button>'+
        '<button class="chip alt" data-k="visit" aria-pressed="'+m.visit+'">주중 심방</button></div>'+
    '</div>'}).join("");
  updateSummary();
}
$("#r-members").addEventListener("input",function(e){
  var c=e.target.closest(".mcard"); if(!c)return;
  R.members[+c.dataset.i][e.target.dataset.k]=e.target.value; updateSummary();});
$("#r-members").addEventListener("click",function(e){
  var c=e.target.closest(".mcard"); if(!c)return;
  var m=R.members[+c.dataset.i];
  if(e.target.dataset.type){m.type=e.target.dataset.type;renderMembers();}
  else if(e.target.classList.contains("chip")){var k=e.target.dataset.k;m[k]=!m[k];
    e.target.setAttribute("aria-pressed",m[k]);updateSummary();}});
$("#r-add").onclick=function(){
  if(R.members.length>=16)return toast("종이 서식은 16명까지입니다");
  R.members.push(blankMember());renderMembers();};

function counts(){
  var named=R.members.filter(function(m){return m.name.trim()}),c={};
  TYPES.forEach(function(t){c[t]={
    roll:named.filter(function(m){return m.type===t}).length,
    att:named.filter(function(m){return m.type===t&&m.worship}).length}});
  return c;}
function updateSummary(){
  var c=counts(), v=+($("#r-visit").value||0);
  var rt=TYPES.reduce(function(a,t){return a+c[t].roll},0);
  var at=TYPES.reduce(function(a,t){return a+c[t].att},0)+v;
  $("#r-sum").innerHTML=
    '<div class="sumline"><span>재적 (기존·장결·새가족)</span><b>'+c["기존"].roll+" · "+c["장결"].roll+" · "+c["새가족"].roll+" = "+rt+'</b></div>'+
    '<div class="sumline"><span>주일출석 (기존·장결·새가족·방문)</span><b>'+c["기존"].att+" · "+c["장결"].att+" · "+c["새가족"].att+" · "+v+" = "+at+'</b></div>';}
$("#r-visit").oninput=function(){R.visit=this.value;updateSummary()};

function renderNew(){
  $("#r-newcomers").innerHTML=R.newcomers.map(function(n,i){return ''+
    '<div class="mcard" data-i="'+i+'">'+
      '<div class="grid g2">'+
        '<div><label class="f">이름</label><input type="text" data-k="name" value="'+esc(n.name)+'"></div>'+
        '<div><label class="f">등록일</label><input type="date" data-k="reg" value="'+esc(n.reg)+'"></div></div>'+
      '<div style="margin-top:8px"><label class="f">인도자</label><input type="text" data-k="guide" value="'+esc(n.guide)+'"></div>'+
      '<div class="chips">'+
        '<button class="chip alt" data-k="tel" aria-pressed="'+n.tel+'">전화</button>'+
        '<button class="chip alt" data-k="visit" aria-pressed="'+n.visit+'">심방</button></div>'+
      '<input type="text" data-k="etc" style="margin-top:8px" value="'+esc(n.etc)+'" placeholder="기타 섬김 내용">'+
    '</div>'}).join("");}
$("#r-newcomers").addEventListener("input",function(e){
  var c=e.target.closest(".mcard"); if(!c)return;
  R.newcomers[+c.dataset.i][e.target.dataset.k]=e.target.value;});
$("#r-newcomers").addEventListener("click",function(e){
  var c=e.target.closest(".mcard"); if(!c||!e.target.classList.contains("chip"))return;
  var n=R.newcomers[+c.dataset.i],k=e.target.dataset.k;
  n[k]=!n[k];e.target.setAttribute("aria-pressed",n[k]);});
$("#r-addnew").onclick=function(){R.newcomers.push(blankNew());renderNew()};
["cell","leader","date","etc"].forEach(function(k){
  var el=$("#r-"+k); el.oninput=function(){R[k]=el.value}});

/* ══ 종이 서식 ══ */
function paper(){
  var c=counts(), v=+($("#r-visit").value||0), d=R.date?R.date.split("-"):["","",""];
  var rows="";
  for(var i=0;i<16;i++){
    var m=R.members[i]||blankMember();
    rows+='<tr><td>'+(i+1)+'</td><td class="l">'+esc(m.name)+'</td>'+
      '<td>'+(m.worship?"○":"")+'</td><td>'+(m.cellmt?"○":"")+'</td>'+
      '<td>'+(m.bible?"○":"")+'</td><td>'+(m.apply?"○":"")+'</td>'+
      '<td class="l" style="vertical-align:top;padding:5px 7px;word-break:keep-all;line-height:1.6">'+esc(m.note)+'</td>'+
      '<td class="nw">'+bx(m.tel)+'전화&nbsp;&nbsp;'+bx(m.visit)+'심방</td></tr>';}
  var ncs=R.newcomers.length?R.newcomers:[blankNew()];
  var nrows=ncs.map(function(n){return '<tr><td class="l">'+esc(n.name)+'</td><td>'+esc(n.reg)+
    '</td><td class="l">'+esc(n.guide)+'</td><td>'+(n.tel?"○":"")+'</td><td>'+(n.visit?"○":"")+
    '</td><td class="l">'+esc(n.etc)+'</td></tr>'}).join("");
  return '<div class="brand"><span>다음세대를 준비하는 젊은교회</span><span>함께하는교회</span></div>'+
  '<div class="titlebar"><span class="dept">장년부</span><span class="u">'+esc(R.cell)+'</span>'+
    '<span class="main">셀 보고서</span>'+
    '<span class="right">셀장 : <span class="fin">'+esc(R.leader)+'</span> &nbsp; '+
      '<span class="fin">'+(d[0]||"")+'</span> 년 <span class="fin" style="min-width:40px">'+(d[1]||"")+'</span> 월 '+
      '<span class="fin" style="min-width:40px">'+(d[2]||"")+'</span> 일</span></div>'+
  '<div class="sec">셀 출석</div>'+
  '<table><colgroup><col span="7" style="width:14.2857%"></colgroup>'+
    '<tr><th colspan="3">재적</th><th colspan="4">주일출석</th></tr>'+
    '<tr><th>기존</th><th>장결</th><th>새가족</th><th>기존</th><th>장결</th><th>새가족</th><th>방문</th></tr>'+
    '<tr><td>'+c["기존"].roll+'</td><td>'+c["장결"].roll+'</td><td>'+c["새가족"].roll+'</td>'+
      '<td>'+c["기존"].att+'</td><td>'+c["장결"].att+'</td><td>'+c["새가족"].att+'</td><td>'+v+'</td></tr></table>'+
  '<table style="margin-top:10px"><colgroup>'+
      '<col style="width:38px"><col style="width:78px"><col style="width:44px"><col style="width:50px">'+
      '<col style="width:56px"><col style="width:56px"><col><col style="width:118px"></colgroup>'+
    '<tr><th rowspan="2">번호</th><th rowspan="2">이름</th><th colspan="2">주일 출석</th>'+
        '<th rowspan="2">성경읽기</th><th rowspan="2">적용점검</th>'+
        '<th rowspan="2">기도제목 · 결석사유</th><th rowspan="2">주중 셀사역</th></tr>'+
    '<tr><th>예배</th><th>셀모임</th></tr>'+rows+'</table>'+
  '<div class="sec">새가족 섬김</div>'+
  '<table><colgroup><col style="width:100px"><col style="width:100px"><col style="width:90px">'+
      '<col style="width:60px"><col style="width:60px"><col></colgroup>'+
    '<tr><th rowspan="2">이름</th><th rowspan="2">등록일</th><th rowspan="2">인도자</th>'+
        '<th colspan="3">새가족 섬김</th></tr>'+
    '<tr><th>전화</th><th>심방</th><th>기타</th></tr>'+nrows+'</table>'+
  '<div class="sec">기타사항 <span style="font-size:12px;font-weight:400">(금주의 사역내용 및 셀보고 사항)</span></div>'+
  '<div class="etc">'+esc(R.etc)+'</div>';
}

/* ══ 캡처 · 공유 ══ */
var shotCanvas=null, shotName="", shotURL="";
function fileName(){return "셀보고서_"+(R.cell||"셀")+"_"+(R.date||today())+".png"}
$("#b-make").onclick=function(){
  var b=$("#b-make"); b.disabled=true; b.textContent="만드는 중…";
  $("#paper").innerHTML=paper();
  setTimeout(function(){
    html2canvas($("#paper"),{scale:2,backgroundColor:"#ffffff"}).then(function(cv){
      shotCanvas=cv; shotName=fileName(); shotURL=cv.toDataURL("image/png");
      $("#shot").src=shotURL;
      $("#m-save").style.display=""; $("#m-share").style.display="";
      $("#m-dl").onclick=function(){saveImage(shotURL,shotName)};
      $("#m-share").onclick=function(){shareImage(shotCanvas,shotName)};
      $("#modal").classList.add("on");
      b.disabled=false; b.textContent="종이 서식 만들기";
    }).catch(function(){toast("이미지를 만들지 못했습니다. 다시 시도해 주세요");
      b.disabled=false; b.textContent="종이 서식 만들기";});
  },80);
};
function saveImage(url,name){
  try{var a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();toast("사진을 저장했습니다");}
  catch(e){toast("이미지를 길게 눌러 저장해 주세요");}
}
function shareImage(cv,name){
  if(!cv||!navigator.canShare) return toast("이미지를 길게 눌러 카톡에 붙여넣어 주세요");
  cv.toBlob(function(blob){
    var f=new File([blob],name,{type:"image/png"});
    if(navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:name}).catch(function(){});
    } else toast("이미지를 길게 눌러 카톡에 붙여넣어 주세요");
  },"image/png");
}
$("#m-close").onclick=function(){$("#modal").classList.remove("on")};

/* ══ 임시 저장 · 보관 ══ */
$("#b-save").onclick=function(){
  DB.set("draft",JSON.stringify(R)).then(function(){toast("임시 저장했습니다")})
    .catch(function(){toast("저장하지 못했습니다")});};

$("#m-save").onclick=function(){
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var payload={title:(R.cell||"셀")+" 셀 보고서",sub:(R.leader||"셀장")+" · "+(R.date||today()),
    cell:R.cell,leader:R.leader,date:R.date||today(),at:new Date().toISOString(),
    data:JSON.parse(JSON.stringify(R)),
    png:shotCanvas?shotCanvas.toDataURL("image/jpeg",0.72):""};
  var b=$("#m-save"); b.disabled=true; b.textContent="저장 중…";
  DB.set("report:"+id,JSON.stringify(payload)).then(function(){
    $("#modal").classList.remove("on"); toast("보관함에 저장했습니다");
  }).catch(function(){toast("저장하지 못했습니다")})
  .then(function(){b.disabled=false;b.textContent="보관함에 저장"});
};

function boot(){
  DB.get("draft").then(function(r){
    var d=JSON.parse(r.value);
    for(var k in d) R[k]=d[k];
    $("#r-cell").value=R.cell; $("#r-leader").value=R.leader;
    $("#r-date").value=R.date; $("#r-etc").value=R.etc; $("#r-visit").value=R.visit||0;
  }).catch(function(){}).then(function(){
    if(!R.date){R.date=today();}
    $("#r-date").value=R.date;
    renderMembers(); renderNew();
  });
  $("#i-where").textContent = DB.kind==="device"
    ? "이 기기에 저장된 보고서입니다. 기기를 바꾸기 전에 백업을 내려받아 두세요."
    : "저장된 보고서 목록입니다.";
}

/* ══ 보관함 ══ */
var inbox=[];
function loadInbox(){
  $("#i-list").innerHTML='<div class="empty">불러오는 중…</div>'; inbox=[];
  DB.list("report:").then(function(res){
    var keys=(res&&res.keys)||[];
    return Promise.all(keys.map(function(k){
      return DB.get(k).then(function(v){
        try{var o=JSON.parse(v.value);o.key=k;inbox.push(o)}catch(e){}
      }).catch(function(){});
    }));
  }).catch(function(){}).then(function(){
    inbox.sort(function(a,b){return String(b.at||"").localeCompare(String(a.at||""))});
    drawInbox();
  });
}
function drawInbox(){
  var q=($("#i-q").value||"").trim().toLowerCase();
  var list=inbox.filter(function(it){return !q||((it.cell||"")+(it.leader||"")).toLowerCase().indexOf(q)>=0});
  $("#i-count").textContent="전체 "+inbox.length+"건"+(q?" · 검색 "+list.length+"건":"");
  var box=$("#i-list");
  if(!list.length){box.innerHTML='<div class="empty">'+
    (q?"찾는 보고서가 없습니다.":"아직 저장된 보고서가 없습니다.<br>작성 후 “보관함에 저장”을 눌러 보세요.")+"</div>";return;}
  box.innerHTML=list.map(function(it){var i=inbox.indexOf(it);
    return '<div class="item"><h4>'+esc(it.title)+'</h4>'+
      '<p>'+esc(it.sub)+' · 저장 '+esc(String(it.at||"").slice(0,16).replace("T"," "))+'</p>'+
      '<div class="acts"><button data-a="img" data-i="'+i+'">사진 보기</button>'+
      '<button data-a="json" data-i="'+i+'">파일 저장</button>'+
      '<button data-a="del" data-i="'+i+'">삭제</button></div></div>'}).join("");
}
$("#i-q").oninput=drawInbox;
$("#i-list").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]"); if(!b)return;
  var it=inbox[+b.dataset.i], a=b.dataset.a;
  if(a==="img"){
    if(!it.png)return toast("저장된 사진이 없습니다");
    $("#shot").src=it.png; shotCanvas=null;
    $("#m-save").style.display="none"; $("#m-share").style.display="none";
    $("#m-dl").onclick=function(){saveImage(it.png,it.title+"_"+(it.date||"")+".jpg")};
    $("#modal").classList.add("on");
  }
  if(a==="json")download(JSON.stringify(it,null,2),it.title+"_"+(it.date||"")+".json","application/json");
  if(a==="del"){
    if(!confirm("이 보고서를 삭제할까요? 되돌릴 수 없습니다."))return;
    DB.del(it.key).then(function(){toast("삭제했습니다");loadInbox()})
      .catch(function(){toast("삭제하지 못했습니다")});}
});
function download(text,name,mime){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+text],{type:mime+";charset=utf-8"}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);}

$("#i-csv").onclick=function(){
  if(!inbox.length)return toast("내려받을 보고서가 없습니다");
  var rows=[["셀","셀장","날짜","구분","이름","예배","셀모임","성경읽기","적용점검","주중전화","주중심방","기도제목/결석사유"]];
  inbox.forEach(function(it){(it.data.members||[]).forEach(function(m){
    if(!m.name)return;
    rows.push([it.cell,it.leader,it.date,m.type,m.name,m.worship?"O":"",m.cellmt?"O":"",
      m.bible?"O":"",m.apply?"O":"",m.tel?"O":"",m.visit?"O":"",String(m.note||"").replace(/"/g,'""')]);});});
  download(rows.map(function(r){return r.map(function(v){return '"'+(v==null?"":v)+'"'}).join(",")}).join("\n"),
    "셀보고서_모음_"+today()+".csv","text/csv");
  toast("CSV를 내려받았습니다");};

$("#i-backup").onclick=function(){
  if(!inbox.length)return toast("백업할 보고서가 없습니다");
  download(JSON.stringify({kind:"cellreport",backupAt:new Date().toISOString(),count:inbox.length,items:inbox},null,2),
    "셀보고서_전체백업_"+today()+".json","application/json");
  toast("백업 파일을 내려받았습니다");};

$("#i-restore").onclick=function(){$("#i-file").click()};
$("#i-file").onchange=function(e){
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);
      var items=o.items||(Array.isArray(o)?o:[o]);
      Promise.all(items.map(function(it){
        var id=(it.key&&it.key.indexOf("report:")===0)?it.key
          :"report:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        return DB.set(id,JSON.stringify(it));
      })).then(function(){toast(items.length+"건을 불러왔습니다");loadInbox();})
        .catch(function(){toast("불러오지 못했습니다")});
    }catch(err){toast("백업 파일 형식이 아닙니다")}
    e.target.value="";
  };
  fr.readAsText(f,"utf-8");
};
})();
</script>
</body>
</html>
