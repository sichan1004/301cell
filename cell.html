<title>301셀</title>
<style>
  :root{
    --paper:#FAFBFB; --ink:#2C3A40; --ink-2:#5C6B71; --line:#DFE4E5;
    --accent:#2C3A40; --accent-soft:#E4F6F3; --teal:#1DAF9F; --teal-ink:#0B5148;
    --amber:#8A6520; --amber-bg:#FFF9EE; --amber-line:#E8CC93; --radius:10px;
    --f:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);font-family:var(--f)}
  .app{color:var(--ink);max-width:560px;margin:0 auto;padding:0 14px 96px;font-size:16px;line-height:1.55}
  .logo{width:132px;height:31px;flex:0 0 132px;background-size:contain;background-repeat:no-repeat;
        background-position:left center;background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAAAlCAMAAADybBJ0AAAAP1BMVEUAAADx8fGenp4bsJ/Y2dnf4+LZ3t2srKxo1ciqqqqc3td0dHR4eHivrq5Ox7md2tMAAAAAAAAAAAAAAAAAAAAya8iuAAAAEHRSTlMAEvf98V2hDfdo6fEPnvqXXkfMZQAABF9JREFUeNrtmI1yrCgQhbsZGpABff+33XMadJyb5NZqdmvvVqUrISoqn6d/gIj82L9sOpqsOg7/KK4/WzlNw2w2OjX8Aj3nrA0NHsSR+o9fxClbPs67dF5iA7/kpjf1q2V1G38KrNZtY5f+ben112/+5d72DQHr42WAHQdgLAUf/fH2Jgt0hugmU3donmXpXQ2Gzowu0d5xMffO7r7gMGWT/E3AmmLaVvJZtK1+7mDp2SIsKVsLUdBqQhPj4pfwq+wEPRqLajGFGGK6F+/lpV+qQMN5SeWx2ueATTrHxchxAnJoR45h2TuSxN2gqMPi5x7gS8FV3MsAjJTzixSRtLNRMgLGKFAwQSgjewYvFAQtLlqCorgn99C/DwjhKB6aVUqKXyaHDZEQiCJEiIhHuBW5YYJITIN4OJqxqqwM6NF8J13OMShiFO+xmSAGOaIyJWdSqtcUjkIMbbMUITVwFc3xBTxmyrCRmRljGsg3FSzD1hrrQ1BvCg+Kc6W48M0U6ACACyEgYaOhBs7OWQE/lJjxmfj05PDx6kQFwGpuIih/dRM/IiDFiaFTohBcJTecGM7xLAKNg3qn8lN0AjXJtuwmrmcM4rH5bBcBEXOvk00t+YEJFYwhhCd+kayBMuIoOB0BkQLoZJSRViWFRcdEwtjgjdPm2ZNvugqI16Ki+PTBFC5pOrzG9VEhSvcRUITBZCi+z9B3QDsQCJgd8PRePOuGjzjj3gE8xWL1GpNcQLoYgzoBvAitcA4GDDKY6H8WG7rcy08I+6R+QsCT6NPxOVHvAFbappWufhQEM07LSkBVvhRsYICDoCi8uCvosQdLewweKkW4+sgVAyCGcVfwRdcBV5970zZmlGrHzEIFny5bGCINL2KYpyuo9D3jMw95bU8LG/VnQelOmQpq4zeJO+BykqQyuEiEWh3XxxmQ/o2uoGcxztJLQdKr0yP83ypcyyjIT84hjYAt+23a7wCKJwd1Wytnu/IGOGJwcS96FnMK0wPQmoxzlVPWut+zPMMA9AC962IUFqF+aAub1d4AVca6IPlM1pkZw7cDMHiUurzyKnvuZCxSD8BZpz0ObgGuic1mcG9JruihoCxBwvh4wprNpHDAmRKaR9VG99ubB+A+lyiTPOflTpJsiEPZrCbWFqsnwKwLHNyXpQ8GQHRpEzCjVGNQG/7PuR91EOU6LV4zn3h26WZHoQ6XAa2Iwq1VUQ+jY6XpZSwWsCgOXeZsxm0GHmi7gk32ydc7EQGm08TeQpJLVje84aqLVSqrs7BZ6+oLwlonYCNgYFDtCjZpB+AYh5unHTDsa1SuyM52qtvXAe28KTnvT3x1uhwy6L5qUq5mCDgUnIA6M96nxg/LqomEnV1EQbpYZqyu8glgmQvo3GDcZb5v8PW8nMp7Jui+5sp6trd7ry5ZueQUbuIKN55jaY0F4fadrf4/+8+AfbFpEUnKeZm7NL2CoO/X9P/9j4z7Mrbf/m/gx37sx/5z+wsWcSZgmZ9DugAAAABJRU5ErkJggg==")}
  .brandbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
  .brandbar .dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
  h2{font-size:19px;margin:16px 0 2px;letter-spacing:-.3px}
  .rule{width:24px;height:2px;background:var(--teal);margin:9px 0 14px}
  h3{font-size:15px;margin:20px 0 8px;color:var(--ink-2);font-weight:600}
  .hint{font-size:13.5px;color:var(--ink-2);margin:0 0 12px;line-height:1.65}
  .card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;margin-bottom:10px}
  .card h4{margin:0 0 4px;font-size:16px}
  .card p{margin:0;font-size:13.5px;color:var(--ink-2)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .dday{flex:0 0 auto;background:var(--accent);color:#fff;font-size:13px;font-weight:700;
        padding:5px 11px;border-radius:14px;white-space:nowrap}
  .dday.soon{background:var(--teal);color:#08332C}
  .tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .tag{font-size:12.5px;padding:5px 10px;border-radius:14px;background:var(--accent-soft);
       color:var(--teal-ink);white-space:nowrap}
  .tag.g{background:#EEF1F1;color:var(--ink-2)}
  .tag.a{background:#FFF0D4;color:var(--amber)}
  .pin{font-size:11.5px;padding:2px 8px;border-radius:10px;background:#FFE873;color:#4E4212;
       font-weight:700;margin-right:6px}
  .empty{text-align:center;color:var(--ink-2);font-size:13.5px;padding:30px 12px;line-height:1.7;
         border:1px dashed var(--line);border-radius:12px;margin-bottom:10px}
  .addbtn{width:100%;padding:13px;border:1px dashed var(--line);background:transparent;
          border-radius:12px;font:inherit;font-size:15px;color:var(--ink-2);cursor:pointer;margin-bottom:10px}
  .btn{padding:14px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;
       color:var(--ink-2);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.wide{display:block;width:100%;margin-bottom:9px}
  .btn:disabled{opacity:.5}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:9px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;
        font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .mon{font-size:13px;color:var(--ink-2);margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .past{opacity:.5}
  .money{display:flex;justify-content:space-between;font-size:14.5px;padding:6px 0;border-bottom:1px solid #EEF1F1}
  .money b{font-variant-numeric:tabular-nums}
  .money.in b{color:var(--teal-ink)} .money.out b{color:#8E3B3B}
  .sum{display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding:11px 0 2px}
  .mini{font-size:12.5px;color:var(--ink-2)}
  .rolecard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;margin-bottom:10px}
  .rolecard .who{font-size:14px;color:var(--teal-ink);background:var(--accent-soft);
                 padding:3px 10px;border-radius:12px}
  .rolecard .who.none{background:var(--amber-bg);color:var(--amber);border:1px dashed var(--amber-line)}
  .plan{margin-top:9px;font-size:14px;color:var(--ink-2);white-space:pre-wrap}
  .lnk{background:none;border:0;color:var(--teal-ink);font:inherit;font-size:13.5px;
       text-decoration:underline;padding:6px 0 0;cursor:pointer}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;
          background:rgba(250,251,251,.97);border-top:1px solid var(--line);display:flex;
          padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--ink-2);
                 padding:9px 2px 8px;cursor:pointer;display:grid;gap:3px;justify-items:center}
  .tabbar button .ico{font-size:19px;line-height:1}
  .tabbar button[aria-selected="true"]{color:var(--teal-ink);font-weight:700}

  .sync{font-size:12px;color:var(--ink-2);padding:6px 0 2px}
  .sync.err{color:#8E3B3B}

  .sheetwrap{position:fixed;inset:0;z-index:100;background:rgba(26,30,36,.6);display:none;overflow:auto;padding:0}
  .sheetwrap.on{display:block}
  .sheet{max-width:560px;margin:40px auto 0;background:var(--paper);border-radius:16px 16px 0 0;
         min-height:calc(100% - 40px);padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{margin:2px 0 14px;font-size:18px;color:var(--ink);font-weight:700}
  label.f{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
  input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;
    font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:-1px}
  .sheetact{display:flex;gap:8px;margin-top:20px}
  .sheetact .btn{flex:1}
  .danger{background:#fff;border-color:#DDAFAF;color:#8E3B3B}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:150;background:var(--ink);
         color:#fff;padding:11px 17px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;
         transition:opacity .2s;max-width:88%;text-align:center;line-height:1.5}
  .toast.on{opacity:1}
</style>
</head>
<body>

<div class="app">
  <div class="brandbar"><span class="logo"></span><span class="dot"></span></div>
  <div class="sync" id="sync">불러오는 중…</div>

  <!-- ══ 홈 ══ -->
  <section id="v-home">
    <h2>301셀</h2><div class="rule"></div>
    <div id="h-next"></div>
    <h3>이번 주 담당</h3>
    <div id="h-duty"></div>
    <h3>이번 달 생일</h3>
    <div id="h-birth"></div>
    <h3>최근 공지</h3>
    <div id="h-notice"></div>
  </section>

  <!-- ══ 일정 ══ -->
  <section id="v-cal" hidden>
    <h2>일정</h2><div class="rule"></div>
    <div class="chips" id="c-filter">
      <button class="chip" data-v="전체" aria-pressed="true">전체</button>
      <button class="chip" data-v="교회" aria-pressed="false">교회 행사</button>
      <button class="chip" data-v="셀" aria-pressed="false">셀 일정</button>
      <button class="chip" data-v="지난" aria-pressed="false">지난 일정</button>
    </div>
    <button class="addbtn" data-new="일정">＋ 일정 추가</button>
    <div id="c-list"></div>
  </section>

  <!-- ══ 역할 ══ -->
  <section id="v-role" hidden>
    <h2>역할</h2><div class="rule"></div>
    <p class="hint">각자 맡은 역할입니다. 카드를 눌러 담당자와 계획을 적어 주세요.</p>
    <div id="r-list"></div>

    <h3>생일 명단 · 경조사</h3>
    <button class="addbtn" data-new="생일">＋ 생일 추가</button>
    <div id="r-birth"></div>

    <h3>회비 내역 · 회계</h3>
    <button class="addbtn" data-new="회비">＋ 수입 · 지출 추가</button>
    <div id="r-money"></div>
  </section>

  <!-- ══ 공지 ══ -->
  <section id="v-notice" hidden>
    <h2>공지사항</h2><div class="rule"></div>
    <button class="addbtn" data-new="공지">＋ 공지 쓰기</button>
    <div id="n-list"></div>
  </section>

  <!-- ══ 보고서 ══ -->
  <section id="v-report" hidden>
    <h2>보고서</h2><div class="rule"></div>
    <p class="hint">셀 보고서는 셀장이 매주 작성합니다. 셀원 카드는 처음 한 번만 작성합니다.</p>
    <a class="btn primary wide" style="text-align:center;text-decoration:none;display:block"
       href="./index.html">셀 보고서 열기</a>
    <a class="btn wide" style="text-align:center;text-decoration:none;display:block"
       href="./card.html">셀원 카드 열기</a>
    <h3>자료 보관</h3>
    <p class="hint">공지 · 일정 · 회비는 모두 구글 시트에 저장됩니다. 앱을 지워도 자료는 남습니다.</p>
    <button class="btn wide" id="b-reload">지금 새로고침</button>
  </section>
</div>

<nav class="tabbar" role="tablist">
  <button role="tab" data-t="home" aria-selected="true"><span class="ico">🏠</span>홈</button>
  <button role="tab" data-t="cal" aria-selected="false"><span class="ico">📅</span>일정</button>
  <button role="tab" data-t="role" aria-selected="false"><span class="ico">🧩</span>역할</button>
  <button role="tab" data-t="notice" aria-selected="false"><span class="ico">📢</span>공지</button>
  <button role="tab" data-t="report" aria-selected="false"><span class="ico">📝</span>보고서</button>
</nav>

<div class="sheetwrap" id="sw"><div class="sheet">
  <h3 id="sh-title">추가</h3>
  <div id="sh-body"></div>
  <div class="sheetact">
    <button class="btn" id="sh-cancel">닫기</button>
    <button class="btn danger" id="sh-del" hidden>삭제</button>
    <button class="btn primary" id="sh-ok">저장</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ▼▼▼ 아래 두 줄만 본인 것으로 바꾸세요 ▼▼▼ */
var API = "https://script.google.com/macros/s/AKfycbxOPGNoPartNkpzFW_UAgwpTxqowdqC5FdugczB818YdfVWOHcSLYErrK-i-QJWnKxR/exec";
var KEY = "cell2026";
/* ▲▲▲ ───────────────────────────── ▲▲▲ */

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
var pad=function(n){return String(n).padStart(2,"0")};
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},2600)}
function daysTo(ymd){
  var a=new Date(ymd+"T00:00:00"), b=new Date(today()+"T00:00:00");
  if(isNaN(a)) return null;
  return Math.round((a-b)/86400000);
}
function ddayText(n){ return n===0?"오늘":(n>0?"D-"+n:"지남"); }
function won(n){ var v=parseInt(String(n).replace(/[^0-9-]/g,""),10)||0;
  return v.toLocaleString("ko-KR")+"원"; }
function wonNum(n){ return parseInt(String(n).replace(/[^0-9-]/g,""),10)||0; }

var DATA={공지:[],일정:[],역할:[],생일:[],회비:[]};
var view="home", filter="전체";

/* ══ 통신 ══ */
function load(){
  $("#sync").className="sync"; $("#sync").textContent="불러오는 중…";
  return fetch(API+"?t="+Date.now())
    .then(function(r){return r.json()})
    .then(function(j){
      if(!j.ok) throw new Error(j.error||"오류");
      DATA=j.data;
      try{ localStorage.setItem("cell:data",JSON.stringify(DATA)) }catch(e){}
      $("#sync").textContent="자료를 불러왔습니다 · "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
      renderAll();
    })
    .catch(function(){
      $("#sync").className="sync err";
      $("#sync").textContent="연결하지 못했습니다. 저장된 내용을 보여 드립니다.";
      try{ var c=localStorage.getItem("cell:data"); if(c){DATA=JSON.parse(c);renderAll();} }catch(e){}
    });
}
function send(body){
  body.key=KEY;
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
                    body:JSON.stringify(body)})
    .then(function(r){return r.json()})
    .then(function(j){ if(!j.ok) throw new Error(j.error||"저장 실패"); return j; });
}

/* ══ 탭 ══ */
document.querySelectorAll(".tabbar button").forEach(function(b){
  b.onclick=function(){
    view=b.dataset.t;
    document.querySelectorAll(".tabbar button").forEach(function(x){
      x.setAttribute("aria-selected", x===b);});
    ["home","cal","role","notice","report"].forEach(function(v){
      $("#v-"+v).hidden = (v!==view);});
    window.scrollTo(0,0);
  };
});
$("#b-reload").onclick=function(){ load().then(function(){toast("새로고침했습니다")}) };

/* ══ 정렬 도우미 ══ */
function byDate(a,b){ return String(a.날짜||"").localeCompare(String(b.날짜||"")) }
function upcoming(){
  return DATA.일정.filter(function(e){ var d=daysTo(e.날짜); return d!==null && d>=0 }).sort(byDate);
}

/* ══ 홈 ══ */
function renderHome(){
  var up=upcoming();
  $("#h-next").innerHTML = up.length ? eventCard(up[0],true)
    : '<div class="empty">다가오는 일정이 없습니다.<br>일정 탭에서 추가해 보세요.</div>';

  var nextCell=up.filter(function(e){return e.구분==="셀"})[0];
  if(nextCell){
    var duty=[["간식",nextCell.간식],["찬양",nextCell.찬양],["뒷정리",nextCell.뒷정리]];
    $("#h-duty").innerHTML='<div class="card"><p class="mini">'+esc(nextCell.날짜)+' · '+esc(nextCell.제목)+'</p>'+
      '<div class="tagline">'+duty.map(function(d){
        return '<span class="tag'+(d[1]?"":" a")+'">'+d[0]+' · '+esc(d[1]||"미정")+'</span>'
      }).join("")+'</div></div>';
  } else $("#h-duty").innerHTML='<div class="empty">예정된 셀모임이 없습니다.</div>';

  var m=new Date().getMonth()+1;
  var bs=DATA.생일.filter(function(b){return parseInt(b.월,10)===m})
                  .sort(function(a,b){return (parseInt(a.일,10)||0)-(parseInt(b.일,10)||0)});
  $("#h-birth").innerHTML = bs.length ? bs.map(function(b){
    return '<div class="card"><div class="row"><span class="grow"><b>'+esc(b.이름)+'</b>'+
      ' <span class="mini">'+esc(b.월)+'월 '+esc(b.일)+'일</span></span>'+
      '<span class="tag'+(b.챙김?"":" a")+'">'+(b.챙김?"챙김 완료":"준비 필요")+'</span></div></div>';
  }).join("") : '<div class="empty">'+m+'월 생일자가 없습니다.</div>';

  var ns=DATA.공지.slice().sort(function(a,b){
    return (b.고정?1:0)-(a.고정?1:0) || String(b.작성일||"").localeCompare(String(a.작성일||""));
  }).slice(0,2);
  $("#h-notice").innerHTML = ns.length ? ns.map(noticeCard).join("")
    : '<div class="empty">등록된 공지가 없습니다.</div>';
}

/* ══ 일정 ══ */
function eventCard(e,big){
  var d=daysTo(e.날짜), past=(d!==null&&d<0);
  var sub=[e.시간,e.장소].filter(Boolean).join(" · ");
  var tags=[];
  if(e.준비물) tags.push('<span class="tag g">준비물 · '+esc(e.준비물)+'</span>');
  if(big){
    if(e.간식) tags.push('<span class="tag">간식 · '+esc(e.간식)+'</span>');
    if(e.찬양) tags.push('<span class="tag">찬양 · '+esc(e.찬양)+'</span>');
    if(e.뒷정리) tags.push('<span class="tag">뒷정리 · '+esc(e.뒷정리)+'</span>');
  }
  return '<div class="card'+(past?" past":"")+'" data-edit="일정" data-id="'+esc(e.id)+'">'+
    '<div class="row"><span class="grow">'+
      '<h4>'+(e.구분==="교회"?'<span class="tag g">교회</span> ':"")+esc(e.제목)+'</h4>'+
      '<p>'+esc(e.날짜)+(sub?" · "+esc(sub):"")+'</p></span>'+
      (d===null?"":'<span class="dday'+(d>=0&&d<=7?" soon":"")+'">'+ddayText(d)+'</span>')+
    '</div>'+
    (tags.length?'<div class="tagline">'+tags.join("")+'</div>':"")+
    (e.메모?'<p class="plan">'+esc(e.메모)+'</p>':"")+
  '</div>';
}
function renderCal(){
  var list=DATA.일정.slice().sort(byDate);
  if(filter==="지난") list=list.filter(function(e){var d=daysTo(e.날짜);return d!==null&&d<0}).reverse();
  else{
    list=list.filter(function(e){var d=daysTo(e.날짜);return d===null||d>=0});
    if(filter!=="전체") list=list.filter(function(e){return e.구분===filter});
  }
  if(!list.length){ $("#c-list").innerHTML='<div class="empty">해당하는 일정이 없습니다.</div>'; return; }
  var out="", cur="";
  list.forEach(function(e){
    var m=String(e.날짜||"").slice(0,7);
    if(m!==cur){ cur=m; out+='<div class="mon">'+esc(m.replace("-","년 ")+"월")+'</div>'; }
    out+=eventCard(e,true);
  });
  $("#c-list").innerHTML=out;
}
$("#c-filter").onclick=function(e){
  if(!e.target.classList.contains("chip"))return;
  filter=e.target.dataset.v;
  document.querySelectorAll("#c-filter .chip").forEach(function(c){
    c.setAttribute("aria-pressed", c===e.target)});
  renderCal();
};

/* ══ 역할 ══ */
var ROLE_HINT={
  "경조사":"이번 달 생일자를 확인하고 준비해 주세요.",
  "회계":"회비 수입과 지출을 기록해 주세요.",
  "간식담당":"다음 모임 간식을 준비해 주세요.",
  "야외셀":"야외 행사 장소와 진행 순서를 계획해 주세요.",
  "찬양":"모임에서 부를 찬양을 정해 주세요.",
  "뒷정리":"모임 후 정리 순서를 정해 주세요."
};
function renderRole(){
  var rs=DATA.역할;
  $("#r-list").innerHTML = rs.length ? rs.map(function(r){
    return '<div class="rolecard" data-edit="역할" data-id="'+esc(r.id)+'">'+
      '<div class="row"><span class="grow"><h4 style="margin:0;font-size:16px">'+esc(r.역할)+'</h4></span>'+
      '<span class="who'+(r.담당자?"":" none")+'">'+esc(r.담당자||"담당자 미정")+'</span></div>'+
      '<p class="plan">'+esc(r.계획||ROLE_HINT[r.역할]||"")+'</p></div>';
  }).join("") : '<div class="empty">역할이 아직 없습니다.<br>구글 시트에서 “처음설정”을 실행해 주세요.</div>';

  var bs=DATA.생일.slice().sort(function(a,b){
    return (parseInt(a.월,10)||0)-(parseInt(b.월,10)||0)||(parseInt(a.일,10)||0)-(parseInt(b.일,10)||0)});
  $("#r-birth").innerHTML = bs.length ? bs.map(function(b){
    return '<div class="card" data-edit="생일" data-id="'+esc(b.id)+'"><div class="row">'+
      '<span class="grow"><b>'+esc(b.이름)+'</b> <span class="mini">'+esc(b.월)+'월 '+esc(b.일)+'일</span></span>'+
      '<span class="tag'+(b.챙김?"":" a")+'">'+(b.챙김?"완료":"준비")+'</span></div>'+
      (b.메모?'<p class="plan">'+esc(b.메모)+'</p>':"")+'</div>';
  }).join("") : '<div class="empty">등록된 생일이 없습니다.</div>';

  var ms=DATA.회비.slice().sort(byDate), inS=0, outS=0;
  ms.forEach(function(m){ if(m.구분==="지출") outS+=wonNum(m.금액); else inS+=wonNum(m.금액); });
  var body=ms.length ? ms.map(function(m){
    var out=(m.구분==="지출");
    return '<div class="money '+(out?"out":"in")+'" data-edit="회비" data-id="'+esc(m.id)+'">'+
      '<span>'+esc(m.날짜)+' · '+esc(m.항목)+'</span>'+
      '<b>'+(out?"-":"+")+won(m.금액)+'</b></div>';
  }).join("") : '<p class="mini" style="padding:6px 0">기록이 없습니다.</p>';
  $("#r-money").innerHTML='<div class="card">'+body+
    '<div class="sum"><span>잔액</span><span>'+won(inS-outS)+'</span></div>'+
    '<p class="mini">수입 '+won(inS)+' · 지출 '+won(outS)+'</p></div>';
}

/* ══ 공지 ══ */
function noticeCard(n){
  return '<div class="card" data-edit="공지" data-id="'+esc(n.id)+'">'+
    '<h4>'+(n.고정?'<span class="pin">고정</span>':"")+esc(n.제목)+'</h4>'+
    '<p>'+esc(n.작성일)+(n.작성자?" · "+esc(n.작성자):"")+'</p>'+
    (n.내용?'<p class="plan">'+esc(n.내용)+'</p>':"")+'</div>';
}
function renderNotice(){
  var ns=DATA.공지.slice().sort(function(a,b){
    return (b.고정?1:0)-(a.고정?1:0) || String(b.작성일||"").localeCompare(String(a.작성일||""));
  });
  $("#n-list").innerHTML = ns.length ? ns.map(noticeCard).join("")
    : '<div class="empty">등록된 공지가 없습니다.<br>위의 “공지 쓰기”를 눌러 보세요.</div>';
}

function renderAll(){ renderHome(); renderCal(); renderRole(); renderNotice(); }

/* ══ 입력 시트 ══ */
var FORMS={
  "공지":[["제목","text"],["내용","area"],["작성자","text"],["고정","sel:|고정"]],
  "일정":[["날짜","date"],["시간","text"],["구분","sel:셀|교회"],["제목","text"],["장소","text"],
          ["준비물","text"],["간식","text"],["찬양","text"],["뒷정리","text"],["메모","area"]],
  "역할":[["역할","text"],["담당자","text"],["계획","area"]],
  "생일":[["이름","text"],["월","num"],["일","num"],["챙김","sel:|완료"],["메모","text"]],
  "회비":[["날짜","date"],["구분","sel:수입|지출"],["항목","text"],["금액","num"],["메모","text"]]
};
var cur={tab:null,id:null};

function openSheet(tab,id){
  cur={tab:tab,id:id||null};
  var row={};
  if(id){ (DATA[tab]||[]).forEach(function(r){ if(r.id===id) row=r; }); }
  else if(tab==="일정"||tab==="회비") row={날짜:today()};
  $("#sh-title").textContent = tab+(id?" 수정":" 추가");
  $("#sh-del").hidden = !id || tab==="역할";
  $("#sh-body").innerHTML = FORMS[tab].map(function(f){
    var k=f[0], ty=f[1], v=esc(row[k]||"");
    var inp;
    if(ty==="area") inp='<textarea data-k="'+k+'">'+v+'</textarea>';
    else if(ty==="date") inp='<input type="date" data-k="'+k+'" value="'+v+'">';
    else if(ty==="num") inp='<input type="number" inputmode="numeric" data-k="'+k+'" value="'+v+'">';
    else if(ty.indexOf("sel:")===0){
      inp='<select data-k="'+k+'">'+ty.slice(4).split("|").map(function(o){
        return '<option value="'+esc(o)+'"'+((row[k]||"")===o?" selected":"")+'>'+(o||"—")+'</option>';
      }).join("")+'</select>';
    }
    else inp='<input type="text" data-k="'+k+'" value="'+v+'">';
    return '<label class="f">'+k+'</label>'+inp;
  }).join("");
  $("#sw").classList.add("on");
}
function closeSheet(){ $("#sw").classList.remove("on"); }
$("#sh-cancel").onclick=closeSheet;
$("#sw").onclick=function(e){ if(e.target===$("#sw")) closeSheet(); };

document.addEventListener("click",function(e){
  var add=e.target.closest("[data-new]");
  if(add){ openSheet(add.dataset.new); return; }
  var ed=e.target.closest("[data-edit]");
  if(ed && !$("#sw").classList.contains("on")){ openSheet(ed.dataset.edit, ed.dataset.id); }
});

$("#sh-ok").onclick=function(){
  var row={};
  $("#sh-body").querySelectorAll("[data-k]").forEach(function(el){ row[el.dataset.k]=el.value; });
  if(cur.tab==="일정"&&!row.제목) return toast("제목을 적어 주세요");
  if(cur.tab==="공지"&&!row.제목) return toast("제목을 적어 주세요");
  if(cur.tab==="생일"&&!row.이름) return toast("이름을 적어 주세요");
  var b=$("#sh-ok"); b.disabled=true; b.textContent="저장 중…";
  send({tab:cur.tab, action:cur.id?"update":"add", id:cur.id, row:row})
    .then(function(){ closeSheet(); toast("저장했습니다"); return load(); })
    .catch(function(err){ toast("저장하지 못했습니다 · "+err.message); })
    .then(function(){ b.disabled=false; b.textContent="저장"; });
};
$("#sh-del").onclick=function(){
  if(!cur.id) return;
  if(!confirm("이 항목을 삭제할까요? 되돌릴 수 없습니다.")) return;
  var b=$("#sh-del"); b.disabled=true;
  send({tab:cur.tab, action:"delete", id:cur.id})
    .then(function(){ closeSheet(); toast("삭제했습니다"); return load(); })
    .catch(function(err){ toast("삭제하지 못했습니다 · "+err.message); })
    .then(function(){ b.disabled=false; });
};

/* ══ 시작 ══ */
try{ var c=localStorage.getItem("cell:data"); if(c){ DATA=JSON.parse(c); renderAll(); } }catch(e){}
if(API.indexOf("__API")===0){
  $("#sync").className="sync err";
  $("#sync").textContent="아직 구글 시트 주소가 연결되지 않았습니다.";
} else load();
})();
</script>
</body>
</html>
